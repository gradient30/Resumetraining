name = "resumetraining"
main = "src/worker.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Static assets: the Vite build output. The Worker serves /api/* and
# falls back to these assets for every other path (SPA).
[assets]
directory = "./dist"
binding = "ASSETS"

# D1 database. Created 2026-11-18 via the Cloudflare API; id below.
# No secret is needed for the id: wrangler reads it from this file.
[[d1_databases]]
binding = "DB"
database_name = "resumetraining-db"
database_id = "eb7d0ff5-664f-4ba0-8fbb-6f8700f6bc85"
migrations_dir = "migrations"
